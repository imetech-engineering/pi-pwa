<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2563EB" id="meta-theme-color" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="robots" content="noindex" />
    <title>IMeTech Pi</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/pi.css" />
    <link rel="icon" href="icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
  </head>
  <body>
    <svg class="ic-sprite" aria-hidden="true" focusable="false">
      <symbol id="ic-overzicht" viewBox="0 0 24 24"><path d="M4 19V10M10 19V5M16 19v-6M21 19H3" /></symbol>
      <symbol id="ic-diensten" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="1.5" /><rect x="3" y="14" width="18" height="6" rx="1.5" /><path d="M7 7h.01M7 17h.01" /></symbol>
      <symbol id="ic-onderhoud" viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z" /></symbol>
      <symbol id="ic-instellingen" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" /></symbol>
      <symbol id="ic-terug" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" /></symbol>
      <symbol id="ic-herstel" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9" /><path d="M4 4v5h5" /></symbol>
      <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6" /></symbol>
    </svg>

    <div id="install-banner" class="install-banner hidden" role="dialog" aria-label="App installeren">
      <div class="install-banner-inner">
        <p><strong>Installeer IMeTech Pi</strong> op je startscherm, dan heb je de Pi altijd bij de hand.</p>
        <div class="install-banner-actions">
          <button type="button" id="btn-install" class="btn-primary">Installeren</button>
          <button type="button" id="btn-install-dismiss" class="btn-secondary">Later</button>
        </div>
      </div>
    </div>

    <header class="app-header">
      <div class="header-text">
        <h1 id="kop">Pi</h1>
        <p id="status" class="sub">Verbinden...</p>
      </div>
      <img id="header-logo" class="header-logo" src="branding/logo-zwart.png" alt="IMeTech Engineering" width="120" height="28" />
    </header>

    <div id="ptr" class="ptr" aria-hidden="true"><svg class="ic"><use href="#ic-herstel"/></svg><span>Trek om te vernieuwen</span></div>
    <main id="scherm"></main>

    <nav class="bottom-nav" aria-label="Hoofdnavigatie">
      <button type="button" data-tab="overzicht" class="actief"><svg class="ic"><use href="#ic-overzicht"/></svg>Overzicht</button>
      <button type="button" data-tab="diensten"><svg class="ic"><use href="#ic-diensten"/></svg>Diensten</button>
      <button type="button" data-tab="onderhoud"><svg class="ic"><use href="#ic-onderhoud"/></svg>Onderhoud <span id="badge" class="badge"></span></button>
      <button type="button" data-tab="instellingen"><svg class="ic"><use href="#ic-instellingen"/></svg>Instellingen</button>
    </nav>

    <div id="toast" class="toast hidden" role="status"><span id="toast-tekst"></span><button type="button" id="toast-knop" class="toast-knop hidden">Herstel</button></div>

    <script src="js/terug.js"></script>
    <script src="js/imetech-apps.js"></script>
    <script src="js/opslag.js"></script>
    <script src="js/api.js"></script>
    <script src="js/install.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
